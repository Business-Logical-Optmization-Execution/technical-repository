spring.application.name=portalblox

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/controle_estoque}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# O Hibernate nunca altera o schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Rotas inexistentes chegam ao GlobalExceptionHandler com 404 padronizado.
# Os recursos estaticos (Swagger UI) continuam mapeados.
spring.mvc.throw-exception-if-no-handler-found=true

# Campo inteiro recebendo decimal responde 400, em vez de truncar (1.5 viraria 1).
spring.jackson.deserialization.accept-float-as-int=false

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always
