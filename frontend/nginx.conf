server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # O DNS do Docker é consultado a cada requisição: se o Spring reiniciar, o nginx o encontra de novo.
        resolver 127.0.0.11 valid=10s;
        set $spring http://backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $spring;
        proxy_set_header Host $host;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
